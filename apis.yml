aid: bariendo-inc
name: Bariendo Inc.
description: Bariendo Inc. (now operating as Everself) is a science-forward digital
  health company pioneering non-surgical, endoscopic weight-loss care. Founded in 2023
  by Harvard Medical School physicians Dr. Christopher C. Thompson (the inventor of
  Endoscopic Sleeve Gastroplasty) and Dr. Pichamol Jirapinyo, the company delivers
  minimally invasive procedures — ESG Stomach Tightening, gastric balloon, and revision
  of prior bariatric surgery — alongside weight-loss medication and a 12-month concierge
  care program. Its consumer platform streamlines access to these interventions across
  a dozen-plus U.S. locations, with financing, telehealth consultations, and ongoing
  weight tracking. Bariendo/Everself is a consumer and clinical health service; it
  publishes no public developer portal, API, or SDK surface.
